name: Prepare
description: Prepares the repository for a typical CI job

runs:
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1
      with:
        node-version: lts/*
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: latest
    - run: bun install --frozen-lockfile
      shell: bash
  using: composite
