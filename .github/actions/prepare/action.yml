name: Prepare
description: Prepares the repository for a typical CI job

runs:
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - run: bun install --frozen-lockfile
      shell: bash
  using: composite
